name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: show_stage/package-lock.json
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check show_runner
      - run: python -m ruff format --check show_runner
      - run: python -m pytest -q
      - run: npm ci --prefix show_stage
      - run: npx playwright install --with-deps chromium
        working-directory: show_stage
      - run: npm run test:e2e --prefix show_stage
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: show_stage/test-results/
