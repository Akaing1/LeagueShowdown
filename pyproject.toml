[project]
name = "league-showdown"
version = "0.1.1"
description = "A host-led League of Legends game show for three contestants"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["show_runner/tests"]
pythonpath = ["show_runner"]

[tool.ruff]
line-length = 100
target-version = "py312"
include = ["show_runner/**/*.py"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["show_runner"]
include = ["app*"]

[tool.setuptools.package-data]
app = ["content/who_am_i/*.json"]
